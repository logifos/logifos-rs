[files]
extend-exclude = [".git", "target", ".venv"]

[default.extend-words]
logifos = "logifos"
plurimath = "plurimath"
Fontisan = "Fontisan"
claricle = "claricle"
svgpng = "svgpng"
# OpenType glyph-location table tag.
loca = "loca"

# plurimath's own symbol class names, carried verbatim by the generated
# operator inventory (scripts/generate-operator-wire.rb) — upstream
# spellings, not typos.
Nin = "Nin"
Oint = "Oint"
Pointint = "Pointint"
Simle = "Simle"
