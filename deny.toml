# Audit every workspace member, including unpublished bootstrap crates, and all
# dependency targets. Do not narrow the graph to the runner's operating system.
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
# Fontisan uses BSD-3-Clause; its pure Rust dependencies also offer the
# Unicode and Zlib terms listed here.
allow = ["MIT", "BSD-3-Clause", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.95

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Unpublished workspace members use local paths without registry versions.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/fontist/fontisan-rs"]
