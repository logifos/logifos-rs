# Audit every workspace member, including unpublished bootstrap crates, and all
# dependency targets. Do not narrow the graph to the runner's operating system.
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
# Dependencies use MIT terms except for the explicit Unicode data notice below.
allow = ["MIT"]
confidence-threshold = 0.95

# unicode-ident ships Unicode tables under an additional notice-preservation
# license. Artifact packages include that notice alongside dependency MIT terms.
[[licenses.exceptions]]
name = "unicode-ident"
version = "=1.0.27"
allow = ["MIT", "Unicode-3.0"]

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Unpublished workspace members use local paths without registry versions.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
