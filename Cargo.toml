[workspace]
resolver = "2"
members = [
    "crates/logifos-json",
    "crates/logifos-model",
    "crates/logifos-syntax-mathml",
    "crates/logifos-layout",
    "crates/logifos-svg",
    "crates/logifos-facade",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["Ribose Inc. <open.source@ribose.com>"]
license = "MIT"
repository = "https://github.com/logifos/logifos-rs"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
